[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kasner-scattering"
version = "2.0.0"
description = "Independent reproduction of coherent critical Kasner response"
license = {file = "LICENSE"}
requires-python = "==3.11.*"
dependencies = [
  "matplotlib==3.8.0",
  "mpmath==1.3.0",
  "numpy==1.26.4",
  "numba==0.59.0",
  "scipy==1.16.3",
  "sympy==1.13.1",
  "threadpoolctl==3.6.0",
]

[project.optional-dependencies]
test = ["pytest==7.4.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -m 'not slow'"
testpaths = ["tests"]
markers = ["slow: complete numerical reconstruction (several minutes)"]
