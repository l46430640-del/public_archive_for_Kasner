[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kasner-scattering"
version = "1.0.0"
description = "Minimal reproduction package for vanishing-energy first-wall Kasner scattering"
requires-python = "==3.11.*"
dependencies = [
  "matplotlib==3.8.0",
  "mpmath==1.3.0",
  "numpy==1.26.4",
  "scipy==1.16.3",
  "sympy==1.13.1",
]

[project.optional-dependencies]
test = ["pytest==7.4.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -m 'not slow'"
testpaths = ["tests"]
markers = ["slow: complete numerical reconstruction (several minutes)"]
